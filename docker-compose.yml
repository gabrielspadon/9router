services:
  tokenproxy:
    image: tokenproxy:latest
    container_name: tokenproxy
    restart: always
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - tokenproxy-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    # Loopback only, matching the tokenproxy port above. tokenproxy reaches Headroom
    # over the compose network at http://headroom:8787, so this mapping exists
    # for host-side debugging and must not be a LAN-reachable compression proxy.
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  tokenproxy-data:
    name: tokenproxy-data
