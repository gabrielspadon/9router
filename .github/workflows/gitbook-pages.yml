name: Deploy GitBook to 9router.github.io

# The paths filter on the on: block below is safe here because this workflow is
# a deploy that carries no required check. Nothing in branch protection waits on
# its name, so a push that the filter skips leaves no status Pending and blocks
# no merge. It only means the docs site was not redeployed, which is correct
# when the push did not touch the docs.
#
# Do not copy this pattern into a workflow whose name is a required check. There
# a skipped run reports neither success nor failure, the check stays Pending
# forever, and the pull request can never merge. Gate that work at job level with
# if:, which still reports success. See .github/workflows/ci.yml.
on:
  push:
    branches: [main, master]
    paths:
      - "gitbook/**"
      - ".github/workflows/gitbook-pages.yml"
  workflow_dispatch:

concurrency:
  group: gitbook-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitbook
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to 9router.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: 9router/9router.github.io
          publish_branch: main
          publish_dir: gitbook/out
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
